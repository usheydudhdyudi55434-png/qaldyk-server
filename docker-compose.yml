services:
  postgres:
    image: postgres:18
    container_name: qaldyk-postgres
    environment:
      POSTGRES_DB: qaldyk_db
      POSTGRES_USER: qaldyk_user
      POSTGRES_PASSWORD: baxa2005
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaldyk_user -d qaldyk_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  django:
    build: .
    container_name: qaldyk-django
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: qaldyk-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: qaldyk-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: qaldyk-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
