{% load i18n %}
{% load static %}

<!DOCTYPE html>

<html lang="{{ LANGUAGE_CODE|default:'kk' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% translate "Qaldyq — Кіру" %}</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'sensor/img/qaldyq-icon.svg' %}">
    <link rel="apple-touch-icon" href="{% static 'sensor/img/qaldyq-apple-touch-icon.png' %}">

    <!-- Apply the saved theme before first paint -->
    <script>
        try {
            if (localStorage.getItem("qaldyk-theme") === "light") {
                document.documentElement.dataset.theme = "light";
            }
        } catch (error) {}
    </script>

    <link
        rel="stylesheet"
        href="{% static 'sensor/css/dashboard.css' %}?v={{ css_version }}"
    >

</head>

<body class="login-page">

<svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-full" viewBox="0 0 24 24">
        <path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/>
        <path d="M12 8v5M12 16.5v.01"/>
    </symbol>
</svg>

<div class="login-language">{% include "language_menu.html" %}</div>

<main class="login-card">

    <div class="login-brand">

        <img
            class="brand-wordmark wordmark-white"
            src="{% static 'sensor/img/qaldyq-wordmark-white.png' %}"
            alt="Qaldyq"
            width="160"
            height="56"
        >

        <img
            class="brand-wordmark wordmark-navy"
            src="{% static 'sensor/img/qaldyq-wordmark-navy.png' %}"
            alt="Qaldyq"
            width="160"
            height="56"
        >

        <div class="brand-note">{% translate "Қалдықтарды бақылау жүйесі" %}</div>

    </div>

    <h1>{% translate "Диспетчер панеліне кіру" %}</h1>

    {% if form.non_field_errors %}
    <div class="login-error level-full" role="alert">
        <svg class="icon" aria-hidden="true"><use href="#i-full"></use></svg>
        {{ form.non_field_errors.0 }}
    </div>
    {% endif %}

    <form method="post" class="login-form">

        {% csrf_token %}

        <input type="hidden" name="next" value="{{ next }}">

        <label class="login-field">
            <span>{% translate "Логин" %}</span>
            {{ form.username }}
        </label>

        <label class="login-field">
            <span>{% translate "Құпия сөз" %}</span>
            {{ form.password }}
        </label>

        <button type="submit" class="login-submit">{% translate "Кіру" %}</button>

    </form>

</main>

</body>
</html>
